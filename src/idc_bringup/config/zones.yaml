# zones.yaml — racks.yaml에서 파생한 Z1~Z4 순찰 구역 폴리곤
# 좌표계: ROS map frame, 단위 m
# Y 범위: 각 aisle_y ± 0.615
# X 범위: trunk_x ~ board.width
zones:
  Z1:
    polygon:
      - [1.400, 4.285]
      - [3.500, 4.285]
      - [3.500, 5.515]
      - [1.400, 5.515]
  Z2:
    polygon:
      - [1.400, 2.885]
      - [3.500, 2.885]
      - [3.500, 4.115]
      - [1.400, 4.115]
  Z3:
    polygon:
      - [1.400, 1.485]
      - [3.500, 1.485]
      - [3.500, 2.715]
      - [1.400, 2.715]
  Z4:
    polygon:
      - [1.400, 0.085]
      - [3.500, 0.085]
      - [3.500, 1.315]
      - [1.400, 1.315]

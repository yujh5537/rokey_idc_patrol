# racks.yaml — MAP-02 산출물. 좌표계: 보드 좌하단 원점, x→, y↑, m, yaw rad (ROS map 프레임)
# rack_id = "R" + aruco_id 2자리. row 1 = 도면 최상단 줄. col 1 = 오른쪽 벽 쪽.
# face: 랙 도어가 향하는 방향. inspect_pose: 통로 중심선(랙 면에서 0.615m)에서 랙 도어 중심을 보는 pose.
# col 1은 벽 간섭으로 x=3.229 클램프, yaw는 도어 중심 지향(≈74.9°/−74.9°) — oblique: true. AC는 "카메라 광축이 도어 중심 ±3°".
board: {width: 3.5, height: 5.6, corridor_width: 0.8, mid_wall_opening_y: [2.4, 3.2], trunk_x: 1.4}
zones:
  Z1: {aisle_y: 4.900, entry_pose: {x: 1.4, y: 4.900, yaw: 0.0}}
  Z2: {aisle_y: 3.500, entry_pose: {x: 1.4, y: 3.500, yaw: 0.0}}
  Z3: {aisle_y: 2.100, entry_pose: {x: 1.4, y: 2.100, yaw: 0.0}}
  Z4: {aisle_y: 0.700, entry_pose: {x: 1.4, y: 0.700, yaw: 0.0}}
docks:
  robot11: {x: 0.27, y: 4.920, yaw: 3.1416}   # 원 중심, 로봇 전면 -x. AMCL 초기 pose로 사용
  robot5: {x: 0.27, y: 0.330, yaw: 3.1416}   # 원 중심, 로봇 전면 -x. AMCL 초기 pose로 사용
robot_zones:
  robot11: ['Z1', 'Z2']
  robot5: ['Z3', 'Z4']

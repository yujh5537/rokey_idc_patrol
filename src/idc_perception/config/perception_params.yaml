# 인식 노드 파라미터 — PC1·PC2 공용. 로봇별 차이는 launch 인자(namespace)로만.
/**:
  yolo_node:
    ros__parameters:
      model_path: ""            # launch 인자 model_path 로 덮어씀 (가중치는 레포 밖: ~/idc_ws/models/)
      conf: 0.5                 # SDD 5.4
      imgsz: 640                # GPU 없으면 480 (SRD SR-S13)
      device: "cpu"             # GPU 있으면 "0"
      max_fps: 10.0
      publish_annotated: true
      annotated_hz: 5.0
  aruco_node:
    ros__parameters:
      dictionary: "DICT_5X5_250"   # SDD 3.1
      marker_len: 0.02
      min_id: 1
      max_id: 56
  perception_node:
    ros__parameters:
      racks_yaml: ""            # 비우면 idc_bringup/config/racks.yaml
      image_width: 640          # OAK-D 발행 해상도에 맞출 것 (현장 확인)
      sync_tol_sec: 0.15
      yolo_timeout_sec: 1.0
      publish_without_door: true

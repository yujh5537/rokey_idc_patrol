map_merge:
  ros__parameters:
    merging_rate: 4.0
    discovery_rate: 0.05
    estimation_rate: 0.5
    estimation_confidence: 0.6
    robot_map_topic: map
    robot_map_updates_topic: map_updates
    robot_namespace: "robot"
    merged_map_topic: map
    world_frame: world
    known_init_poses: true

    # 아래 init_pose_* 는 control_pc_full.launch.py 의 r5_*/r11_* 인자로 실행 시 덮어써진다
    # (RewrittenYaml). TF static(world->robotN/map) 과 항상 같은 값 — 여기만 고치지 말 것.
    # yaw = π: 기본 좌표계에서 x·y 를 180° 회전한 좌표계 사용
    /robot5/map_merge/init_pose_x: 0.0
    /robot5/map_merge/init_pose_y: 0.0
    /robot5/map_merge/init_pose_z: 0.0
    /robot5/map_merge/init_pose_yaw: 3.14159265

    /robot11/map_merge/init_pose_x: 0.0
    /robot11/map_merge/init_pose_y: 4.53
    /robot11/map_merge/init_pose_z: 0.0
    /robot11/map_merge/init_pose_yaw: 3.14159265
